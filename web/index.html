<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apprentice-app" content="ai-apprentice" />
    <!-- MiniERP is just a work app to Ada: the extension coaches there like on any site; it only publishes structured events (a "feed") -->
    <script>if (location.pathname.startsWith("/erp")) document.querySelector('meta[name="apprentice-app"]').content = "feed";</script>
    <!-- No extension installed (e.g. a judge opening the hosted demo): the same overlay + save hold from the embed build. Steps aside when the extension is there. -->
    <script>if (location.pathname.startsWith("/erp")) { const s = document.createElement("script"); s.src = "/apprentice-embed.js"; s.defer = true; document.head.appendChild(s); }</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Protégé</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
